{% extends 'base.html' %}{% block content %}<div class="card planner"><span class="badge">{{ planner|upper }} PLANNER</span>{% if planner=='home' %}<h1>Home Interior Budget Planner</h1><form id="homeForm"><label>Budget (₹)<input name="budget" type="number" min="1" required></label><label>Rooms<input name="rooms" placeholder="Living Room, Bedroom" required></label><label>Style<select name="style"><option>modern</option><option>minimalist</option><option>traditional</option><option>contemporary</option></select></label><label>Quantities (optional JSON)<textarea name="quantities">{"lights":2,"fans":2,"dining_tables":1}</textarea></label><label>Priorities<input name="priorities" placeholder="functionality, style, price"></label><button class="btn">Generate Home Recommendations</button></form>{% elif planner=='party' %}<h1>Party Budget Planner</h1><form id="partyForm"><label>Budget (₹)<input name="budget" type="number" min="1" required></label><label>Guests<input name="guests" type="number" min="1" required></label><label>Event type<input name="event_type" placeholder="Birthday, wedding, corporate" required></label><label>Venue preference<input name="venue" placeholder="Hall, home, hotel, any"></label><label>Preferences<input name="preferences" placeholder="vegetarian, music, decoration"></label><button class="btn">Generate Party Recommendations</button></form>{% else %}<h1>Jewelry Budget Planner</h1><form id="jewelryForm" enctype="multipart/form-data"><label>Budget (₹)<input name="budget" type="number" min="1" required></label><label>Occasion<input name="occasion" placeholder="Wedding, birthday, office" required></label><label>Style<select name="style"><option>modern</option><option>traditional</option><option>minimalist</option><option>statement</option></select></label><label>Preferences<input name="preferences" placeholder="gold tone, pearl, jhumka"></label><label>Outfit image (optional)<input name="outfit" type="file" accept="image/jpeg,image/png,image/webp"></label><button class="btn">Generate Jewelry Recommendations</button></form>{% endif %}<div id="result" class="result"></div></div>{% endblock %}
