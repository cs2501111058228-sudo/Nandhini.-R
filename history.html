{% extends 'base.html' %}{% block content %}<div class="card"><h1>Recommendation History</h1>{% if rows %}<table><tr><th>Planner</th><th>Budget</th><th>Date</th><th>Details</th></tr>{% for r in rows %}<tr><td>{{ r.planner|title }}</td><td>₹{{ '%.0f'|format(r.budget) }}</td><td>{{ r.created_at }}</td><td><a href="/recommendations-details?id={{ r.id }}">JSON</a></td></tr>{% endfor %}</table>{% else %}<p>No history.</p>{% endif %}</div>{% endblock %}
